# =====================================================================================
# THE SIGNAL: what counts as "relevant" to YOU. Edit freely; it is re-read on every run.
#
# How a story is scored:
#   * Every keyword below is matched case-insensitively on word boundaries.
#   * A keyword found in the TITLE counts double, in the summary once.
#   * The story needs a total >= selection.min_score to make the paper. Raise it for a thinner
#     paper, lower it for a fatter one.
#   * Stories about a watchlist company get a bonus. Stories covered by several outlets get a bonus.
#   * Noise patterns (deals, celebrity, sports, "how to watch") are dropped or demoted.
# =====================================================================================

selection:
  min_score: 14
  max_per_section: 6
  editor_candidates: 28     # how many top candidates the (optional) LLM editor looks at
  max_age_hours: 36         # news older than this never makes the paper
  watchlist_bonus_title: 8
  watchlist_bonus_summary: 3
  cluster_bonus: 4          # per extra outlet covering the same story (capped at 4 extras)

# Companies you are invested in. They get a boost and a clickable chip in the UI.
# Add more (xAI, Nvidia, Google DeepMind ...) by copying the pattern.
watchlist:
  OpenAI:
    match: [openai, chatgpt, "sam altman", sora, "gpt-5", "gpt-6"]
  Anthropic:
    match: [anthropic, "claude code", "claude opus", "claude sonnet", "claude haiku", "claude mythos", "dario amodei"]
    bare: claude                       # only counts if one of the context words also appears
    context: [ai, anthropic, model, llm, chatbot, agent, code]
  Meta:
    match: ["meta ai", "meta platforms", "meta superintelligence", "meta's ai", zuckerberg, llama, "alexandr wang"]
    bare: meta
    context: [ai, superintelligence, llm, model, chip, "data center", glasses, "ray-ban"]
  SpaceX:
    match: [spacex, starship, starlink, "falcon 9", "falcon heavy", starbase, "crew dragon"]
  # xAI:
  #   match: [xai, grok]
  # Nvidia:
  #   match: [nvidia, jensen huang]

