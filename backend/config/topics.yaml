# Generic AI vocabulary: adds to relevance but does not decide which section a story lands in.
core:
  ai: 3
  "artificial intelligence": 4
  "generative ai": 4
  "machine learning": 2
  "neural network": 2
  "ai model": 4
  "ai lab": 5
  "ai startup": 4

noise:
  drop:   # a match anywhere in the title removes the story
    - '\b(best|top)\s+\d*\s*(deals?|gifts?)\b'
    - 'black friday|cyber monday|prime day|coupon|promo code|\d+% off|discount code'
    - 'horoscope|zodiac|kardashian|taylor swift|box office|\bnfl\b|\bnba\b|premier league|cricket score'
    - 'how to watch|where to watch|live ?stream'
    - '\bsponsored\b|\bwebinar\b|\bpress release\b'
    - 'giveaway|sweepstakes'
  demote: # a match halves the score
    - 'weekly roundup|week in review|newsletter|podcast'
    - '\bopinion\b|\bop-ed\b'
    - 'hands-on|review:'

# Smart reads: ideas that expand how you think. Scored by keywords, depth and recency.
reads:
  count: 3
  max_age_days: 21
  repeat_window_days: 45     # never show the same essay again within this many days
  keywords:
    intelligence: 3
    consciousness: 4
    cognition: 4
    mind: 2
    thinking: 2
    reasoning: 3
